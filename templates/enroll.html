{% extends "base.html" %}{% block title %}New enrolment{% endblock %}{% block crumb %}Enrolments{% endblock %}
{% block content %}<section class="page-heading"><div><div class="eyebrow">COURSE MANAGEMENT <span>✦</span></div><h1>New enrolment</h1><p class="muted">Connect a learner to a course.</p></div></section>
<section class="panel form-panel"><form method="post" class="form-grid"><label>Choose learner<select name="learner_id" required>{% for l in learners %}<option value="{{ l.learner_id }}">{{ l.roll_no }} — {{ l.learner_name }}</option>{% endfor %}</select></label><label>Choose course<select name="course_id" required>{% for c in courses %}<option value="{{ c.course_id }}">{{ c.course_name }}</option>{% endfor %}</select></label><div class="form-actions"><a class="btn btn-soft" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Create enrolment →</button></div></form></section>{% endblock %}
