{% extends "base.html" %}{% block title %}Log activity{% endblock %}{% block crumb %}Log activity{% endblock %}
{% block content %}<section class="page-heading"><div><div class="eyebrow">LEARNING RECORDS <span>✦</span></div><h1>Log an activity</h1><p class="muted">Record a lesson, quiz, video, assignment, or reading activity.</p></div></section>
<section class="panel form-panel"><form method="post" class="form-grid"><label>Learner and course<select name="enrollment_id" required>{% for e in enrollments %}<option value="{{ e.enrollment_id }}">{{ e.learner_name }} — {{ e.course_name }}</option>{% endfor %}</select></label><label>Activity date<input type="date" name="activity_date" value="{{ today }}" required></label><label>Activity type<select name="activity_type" required><option value="lesson">Lesson</option><option value="quiz">Quiz</option><option value="video">Video</option><option value="assignment">Assignment</option><option value="reading">Reading</option></select></label><label class="check-label"><input type="checkbox" name="completed" value="1"> Mark activity as completed</label><div class="form-actions"><a class="btn btn-soft" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Save activity →</button></div></form></section>{% endblock %}
